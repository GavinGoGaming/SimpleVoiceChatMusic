  volume:
    title: "Volume"
    hint: "<dark_gray>Drag the slider and press Apply volume; it affects everyone in this voice group.</dark_gray>"
  settings:
    title: "Settings"
    hint: "<dark_gray>Bass / language / source / toggles; volume has its own page.</dark_gray>"
