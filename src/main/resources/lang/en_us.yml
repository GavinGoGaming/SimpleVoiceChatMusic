# =====================================================================================
#  SimpleVoiceChatMusic - English (en_us)
# =====================================================================================
#  语法：MiniMessage  https://docs.advntr.dev/minimessage/format.html
#  支持嵌套，最终会展开成 "general.usage" 这样的点分键。
#  可用占位符见各条目注释；占位符由代码注入，请勿删除尖括号部分。
#
#  想新增一种语言：复制本文件为 lang/<语言代码>.yml（例如 ja_jp.yml / de_de.yml），
#  翻译后重新打包即可，插件启动时会自动扫描 jar 内 lang/*.yml。
# =====================================================================================

general:
  # 所有消息的前缀，config.yml 的 messages.use-prefix 可关闭
  prefix: "<dark_gray>[</dark_gray><aqua>Music</aqua><dark_gray>]</dark_gray> "
  no-permission: "<red>You don't have permission to do that.</red>"
  player-only: "<red>Only players can use this command.</red>"
  unknown-subcommand: "<red>Unknown subcommand.</red> <gray>Use <white>/music</white> to see the command list.</gray>"
  cooldown: "<gray>Slow down a bit, try again in <white><seconds>s</white>.</gray>"
  usage: |-
    <gray>Available commands:</gray>
    <white>/music play \<song title | Spotify link></white> <dark_gray>-</dark_gray> <gray>search and queue the first result</gray>
    <white>/music search \<song></white> <dark_gray>-</dark_gray> <gray>pick from the first few results</gray>
    <white>/music now-playing</white> <dark_gray>-</dark_gray> <gray>show the current song</gray>
    <white>/music queue</white> <dark_gray>-</dark_gray> <gray>show the queue</gray>
    <white>/music skip | pause | resume | stop</white> <dark_gray>-</dark_gray> <gray>playback control</gray>
    <white>/music volume \<0-100> | bassboost \<0-200></white> <dark_gray>-</dark_gray> <gray>audio settings</gray>
    <white>/music lang [code]</white> <dark_gray>-</dark_gray> <gray>change the message language</gray>
    <white>/music menu</white> <dark_gray>-</dark_gray> <gray>open the dialog menu</gray>
    <white>/music source \<bilibili | netease | youtube | soundcloud></white> <dark_gray>-</dark_gray> <gray>switch your default search source</gray>
    <white>/music login \<netease|bilibili></white> <dark_gray>-</dark_gray> <gray>scan a QR code to log in (admin)</gray>
    <white>/music kill</white> <dark_gray>-</dark_gray> <gray>force-restart the player of your group</gray>
  error: "<red>Something went wrong while running that command, check the server console for details.</red>"

voicechat:
  not-ready: "<yellow>Voice chat is still starting up, please try again in a moment.</yellow>"
  not-connected: "<red>You are not connected to voice chat.</red>"
  no-group: "<red>You are not in a voice chat group.</red>"

play:
  all-selected: "<gray>All sources: playing the </gray><white><source></white><gray> result.</gray>"
  usage: '<gray>Usage: <white>/music play \<song title | Spotify link></white></gray>'
  loading: "<gray>Loading songs...</gray>"
  # <player> = 执行命令的玩家, <track> = 曲目信息（带链接）
  queued: "<gray><player> queued <track></gray>"
  queue-full: "<red>The queue is full (or the player has left), that song was not queued.</red>"
  no-matches: "<red>No matches found.</red>"
  # <reason> = 加载失败原因
  failed: "<red>Failed to load that track: <reason></red>"
  failed-internal: "<red>That track failed to load, check the server console for details.</red>"
  spotify-not-configured: "<yellow>Spotify is not configured (spotify.client-id / spotify.client-secret in config.yml). Trying a normal search instead.</yellow>"
  spotify-failed: "<red>Could not look up that Spotify track: <reason></red>"
  error-timeout: "<red>The music server did not respond in time.</red> <gray>Try again later or use another link.</gray>"
  error-disconnected: "<red>The music server closed the connection mid-transfer (anti-leech protection, or a broken CDN slice).</red> <gray>Downloading the file and putting it into the music folder usually works.</gray>"
  error-unreachable: "<red>Could not reach the music server.</red> <gray>Check the link and the server's network.</gray>"
  error-tls: "<red>TLS handshake with the music server failed.</red> <gray>Try the http:// link instead of https://.</gray>"
  error-server: "<red>The music server returned an error status.</red>"
  error-forbidden: "<red>The music server refused the request (HTTP 401/403).</red> <gray>It probably requires a login or blocks hotlinking.</gray>"
  error-not-found: "<red>That link does not exist (HTTP 404).</red>"
  error-empty: "<red>The music server announced a file but sent no data (broken CDN slice or anti-leech).</red> <gray>Try another link.</gray>"
  error-not-audio: "<red>That link is not an audio file.</red> <gray>It returned a web page or some other data.</gray>"
  unsupported-platform: '<red><platform> links are not supported.</red> <gray>Search for the song instead: <white>/music play \<song title></white></gray>'

search:
  usage: '<gray>Usage: <white>/music search \<song></white></gray>'
  loading: "<gray>Searching...</gray>"
  header: "<gray>Found <count> result(s):</gray>"
  bullet: "  <dark_gray>-</dark_gray> "
  click-to-queue: "<green><bold>[Click to queue]</bold></green>"
  # 鼠标悬停在可点击文字上时显示
  click-hover: "<gray>Queue this song</gray>"
  all-loading: "<gray>Searching every source in parallel...</gray>"
  all-empty: "<red>No results from any source.</red>"
  all-header: "<gray>Found </gray><white><count></white><gray> results across all sources:</gray>"

queue:
  current: "<gray>Current:</gray> <track>"
  entry: "<gray><index>.</gray> <track>"
  empty: "<gray>The queue is empty.</gray>"

now-playing:
  nothing: "<gray>Nothing is playing.</gray>"
  # <position>/<duration> 形如 1:23/3:45
  line: "<gray>Now playing</gray> <track> <dark_gray>(<position>/<duration>)</dark_gray> <dark_gray>·</dark_gray> <white><volume>%</white> <gray>volume</gray> <dark_gray>·</dark_gray> <white><bass>%</white> <gray>bass boost</gray>"

skip:
  done: "<gray><player> skipped the current song.</gray>"

pause:
  done: "<gray><player> paused playback.</gray>"

resume:
  done: "<gray><player> resumed playback.</gray>"

stop:
  done: "<gray><player> stopped playback and cleared the queue.</gray>"

volume:
  usage: '<gray>Usage: <white>/music volume \<0-100></white></gray>'
  invalid: "<red>Volume must be a whole number.</red>"
  range: "<red>Volume must be between 0 and 100.</red>"
  set: "<gray><player> set the volume to <white><volume>%</white>.</gray>"

bassboost:
  usage: '<gray>Usage: <white>/music bassboost \<0-200></white></gray>'
  invalid: "<red>Bass boost must be a number.</red>"
  range: "<red>Bass boost must be between 0 and 200.</red>"
  set: "<gray><player> set the bass boost to <white><bass>%</white>.</gray>"

kill:
  warning: "<red><bold>Careful!</bold> This force-kills the player of your group. Group members may hear a short burst of noise as the audio packets stop abruptly.</red><newline><newline><gray>Run the command again to confirm.</gray>"
  broadcast: "<red><player> force-killed the music player.</red>"

track:
  now-playing: "<gray>Now playing:</gray> <track>"
  failed: "<red>Failed to play that song: <reason></red>"
  internal-error: "<red>Failed to play that song due to an internal error.</red>"
  stuck: "<yellow>The track got stuck, skipping it.</yellow>"

playback:
  queue-empty: "<gray>No more songs to play.</gray>"

lang:
  current: "<gray>Current language:</gray> <white><language></white>"
  available: "<gray>Available languages:</gray> <white><languages></white>"
  set: "<gray>Language set to <white><language></white>.</gray>"
  reset: "<gray>Language reset to automatic (<white><language></white>).</gray>"
  unknown: "<red>Unknown language <white><language></white>.</red> <gray>Available:</gray> <white><languages></white>"

service:
  already: "<gray>The voice chat service is already registered.</gray>"
  attempted: "<gray>Registration attempted, check the console for details.</gray>"

# Simple Voice Chat 客户端设置里显示的音量分类（纯文本，不要写标签）
category:
  name: "Music"
  description: "The volume of streamed music."

# BOSS 栏：<title> 是文件名（取不到文件名时用歌曲标题），
# <position>/<duration> 形如 1:23/3:45。
bossbar:
  title: "<white><title></white> <dark_gray>[</dark_gray><gray><position></gray><dark_gray>/</dark_gray><gray><duration></gray><dark_gray>]</dark_gray>"
  unknown-duration: "--:--"

# Kugou Music

bilibili:
  no-results: "<red>Bilibili returned no videos.</red>"
  invalid-link: "<red>That Bilibili link does not contain a BV id.</red>"
  error: "<red>Bilibili API request failed: <reason></red>"
  no-audio: "<red>That video has no playable audio stream (VIP-only or region locked).</red>"
  fallback: "<gray>Bilibili found nothing, falling back to YouTube search.</gray>"
