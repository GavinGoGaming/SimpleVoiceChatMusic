    title: "Restart player"
    body: "<red>Force-restart this group's player?</red>"
    confirm: "Confirm"
    cancel: "Cancel"
  unsupported: "<red>This server does not support dialogs (Paper 1.21.7+ required).</red>"
  disabled: "<red>The dialog menu is disabled (menu.enabled in config.yml).</red>"
netease:
  disabled: "<red>The NetEase source is disabled (netease.enabled).</red>"
  no-results: "<red>NetEase returned no songs.</red>"
  error: "<red>NetEase API request failed: <reason></red>"
  vip-required: "<red>That song needs NetEase VIP or has no playable source.</red> <gray>Ask an admin to run </gray><white>/music login netease</white><gray> with a VIP account.</gray>"
  playlist-queued: "<green>Queued </green><white><count></white><green> songs from the playlist.</green>"
  search-usage: '<red>Usage: </red><white>/music search netease:\<keyword></white>'
  vip-badge: "<gold>[VIP]</gold>"

lyrics:
  line: "<text>"

# Per-player default search/play source
source:
  bilibili: "Bilibili"
  netease: "NetEase"
  youtube: "YouTube"
  soundcloud: "SoundCloud"
  all: "All sources"
  current: "<gray>Your default source: </gray><white><source></white>"
  available: '<gray>Available: </gray><white>bilibili</white><gray> / </gray><white>netease</white><gray> / </gray><white>youtube</white><gray> / </gray><white>soundcloud</white> <dark_gray>(/music source \<id>)</dark_gray>'
  set: "<green>Default source set to </green><white><source></white><gray>; /music play and /music search will use it.</gray>"
  reset: "<green>Restored the server default source: </green><white><source></white>"
  unknown: "<red>Unknown source: </red><white><input></white><gray>. Use bilibili / netease / youtube / soundcloud.</gray>"

# ── Account login (same flow for every platform) ──────────────
platform:
  netease: "NetEase"
  bilibili: "Bilibili"

login:
  usage: '<red>Usage: </red><white>/music login \<netease|bilibili> [status|logout|cookie \<value>]</white>'
  unknown-platform: "<red>Unknown platform: </red><white><input></white><gray>. Use netease or bilibili.</gray>"
  status-line: "<gray><platform>: </gray><green><nickname></green>"
  status-line-none: "<gray><platform>: </gray><red>not logged in</red>"
  logout-all: "<green>All saved credentials were removed.</green>"
  logout-done: "<green>Logged out of <platform> and deleted its credentials.</green>"
  starting: "<gray>Creating a login QR code for <platform>...</gray>"
  scan: "<green>QR map given!</green> <gray>Hold it (or put it in an item frame), scan it with <platform>, then confirm on your phone.</gray>"
  scanned: "<yellow>Scanned. Confirm the login on your phone.</yellow>"
  waiting: "<gray>Still waiting for the scan... the QR code is valid for 3 minutes.</gray>"
  expired: "<red>The QR code expired. Run /music login again.</red>"
  timeout: "<red>Login timed out. Run /music login again.</red>"
  ok: "<green><platform> login succeeded as </green><white><nickname></white><gray>. Credentials saved and shared by every player.</gray>"
  failed: "<red><platform> login failed: </red><gray><reason></gray>"
  risk: "<red><platform> returned a risk-control/error response: </red><gray><detail></gray>"
  in-progress: "<yellow>A login flow is already running; finish it or wait for it to time out.</yellow>"
  already-logged-in: "<yellow>Already logged in to <platform> as <nickname>; scanning again will replace it.</yellow>"
  cookie-usage: '<red>Usage: </red><white>/music login <platform> cookie \<cookie></white> <gray>(copy the whole cookie from your browser)</gray>'
  cookie-checking: "<gray>Checking the cookie...</gray>"
  cookie-invalid: "<red>The cookie is invalid or expired (no account info). Copy it again.</red>"
  cookie-ok: "<green><platform> cookie login succeeded as </green><white><nickname></white><gray>.</gray>"

# ── Loop playback ──────────────────────────────────────────────
loop:
  "off": "Off"
  one: "Repeat one"
  all: "Repeat all"
  current: "<gray>Loop mode: </gray><white><mode></white>"
  set: "<gray><player> set the loop mode to </gray><white><mode></white>"
  usage: '<red>Usage: </red><white>/music loop \<off|one|all></white>'
