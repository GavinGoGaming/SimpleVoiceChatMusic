  netease: "网易云"
  bilibili: "B 站"

login:
  usage: '<red>用法：</red><white>/music login \<netease|bilibili> [status|logout|cookie \<值>]</white>'
  unknown-platform: "<red>未知平台：</red><white><input></white><gray>。可选 netease / bilibili。</gray>"
  status-line: "<gray><platform>：</gray><green><nickname></green>"
  status-line-none: "<gray><platform>：</gray><red>未登录</red>"
  logout-all: "<green>已清除所有账号凭证。</green>"
