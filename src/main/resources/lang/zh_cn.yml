# =====================================================================================
#  SimpleVoiceChatMusic - 简体中文 (zh_cn)
# =====================================================================================
#  语法：MiniMessage  https://docs.advntr.dev/minimessage/format.html
#  颜色标签示例：<red> <gold> <yellow> <green> <aqua> <gray> <dark_gray> <white> <bold>
#  占位符（<player> 等）由代码注入，翻译时请原样保留。
# =====================================================================================

general:
  prefix: "<dark_gray>[</dark_gray><aqua>音乐</aqua><dark_gray>]</dark_gray> "
  no-permission: "<red>你没有权限这样做。</red>"
  player-only: "<red>这条命令只能由玩家执行。</red>"
  unknown-subcommand: "<red>未知的子命令。</red> <gray>输入 <white>/music</white> 查看命令列表。</gray>"
  cooldown: "<gray>慢一点，<white><seconds> 秒</white>后再试。</gray>"
  usage: |-
    <gray>可用命令：</gray>
    <white>/music play \<歌名 | Spotify 链接></white> <dark_gray>-</dark_gray> <gray>搜索并播放第一个结果</gray>
    <white>/music search \<歌名></white> <dark_gray>-</dark_gray> <gray>从搜索结果里挑一首</gray>
    <white>/music now-playing</white> <dark_gray>-</dark_gray> <gray>查看当前播放</gray>
    <white>/music queue</white> <dark_gray>-</dark_gray> <gray>查看播放队列</gray>
    <white>/music skip | pause | resume | stop</white> <dark_gray>-</dark_gray> <gray>播放控制</gray>
    <white>/music volume \<0-100> | bassboost \<0-200></white> <dark_gray>-</dark_gray> <gray>音量与低音</gray>
    <white>/music lang [语言代码]</white> <dark_gray>-</dark_gray> <gray>切换提示语言</gray>
    <white>/music menu</white> <dark_gray>-</dark_gray> <gray>打开图形菜单</gray>
    <white>/music loop \<off | one | all></white> <dark_gray>-</dark_gray> <gray>播放模式（顺序 / 单曲循环 / 列表循环）</gray>
    <white>/music collect \<标识> [标题] | /music like</white> <dark_gray>-</dark_gray> <gray>收藏歌曲</gray>
    <white>/music catalogue \<list | create | play | add | remove | delete></white> <dark_gray>-</dark_gray> <gray>我的音乐 / 收藏目录</gray>
    <white>/music source \<bilibili | netease | youtube | soundcloud></white> <dark_gray>-</dark_gray> <gray>切换自己的默认搜索音源</gray>
    <white>/music login \<netease|bilibili></white> <dark_gray>-</dark_gray> <gray>扫码登录网易云 / B 站（管理员）</gray>
    <white>/music kill</white> <dark_gray>-</dark_gray> <gray>强制重启本组的播放器</gray>
  error: "<red>执行命令时出错，详细信息请查看服务器控制台。</red>"

voicechat:
  not-ready: "<yellow>语音聊天还在启动中，请稍后再试。</yellow>"
  not-connected: "<red>你还没有连接到语音聊天。</red>"
  no-group: "<red>你不在任何语音聊天组里。</red>"

play:
  all-selected: "<gray>全部音源：已选择 </gray><white><source></white><gray> 的结果播放。</gray>"
  usage: '<gray>用法：<white>/music play \<歌名 | Spotify 链接></white></gray>'
  loading: "<gray>正在加载歌曲……</gray>"
  queued: "<gray><player> 点播了 <track></gray>"
  queue-full: "<red>队列已满（或玩家已离开），这首歌没有加入队列。</red>"
  no-matches: "<red>没有找到匹配的歌曲。</red>"
  failed: "<red>加载失败：<reason></red>"
  failed-internal: "<red>这首歌加载失败，详细信息请查看服务器控制台。</red>"
  spotify-not-configured: "<yellow>Spotify 尚未配置（config.yml 里的 spotify.client-id / spotify.client-secret），已改为普通搜索。</yellow>"
  spotify-failed: "<red>查询 Spotify 曲目失败：<reason></red>"
  error-timeout: "<red>音源服务器响应超时。</red><gray>稍后再试，或换一个链接。</gray>"
  error-disconnected: "<red>音源服务器中途断开了连接（可能是防盗链，或 CDN 的切片本身是坏的）。</red><gray>把文件下载后放进 music 目录再播放通常就能用。</gray>"
  error-unreachable: "<red>无法连接到音源服务器。</red><gray>请检查链接和服务器网络。</gray>"
  error-tls: "<red>与音源服务器的 TLS 握手失败。</red><gray>可以试试把 https:// 换成 http://。</gray>"
  error-server: "<red>音源服务器返回了错误状态码。</red>"
  error-forbidden: "<red>音源服务器拒绝了请求（HTTP 401/403）。</red><gray>可能需要登录，或者做了防盗链。</gray>"
  error-not-found: "<red>这个链接不存在（HTTP 404）。</red>"
  error-empty: "<red>服务器声明了文件，却一个字节都没返回（CDN 切片损坏或防盗链）。</red><gray>换一个链接试试。</gray>"
  error-not-audio: "<red>这个链接不是音频文件。</red><gray>它返回的像是网页或接口数据。</gray>"
  unsupported-platform: '<red>暂不支持 <platform> 的链接。</red><gray>可以直接搜索歌名：<white>/music play \<歌名></white></gray>'

search:
  usage: '<gray>用法：<white>/music search \<歌名></white></gray>'
  loading: "<gray>正在搜索……</gray>"
  header: "<gray>找到 <count> 个结果：</gray>"
  bullet: "  <dark_gray>-</dark_gray> "
  click-to-queue: "<green><bold>[点击加入队列]</bold></green>"
  click-hover: "<gray>把这首歌加入队列</gray>"
  next-page: "<gray>—— 第 <page> 页 ——</gray> <green>[下一页]</green>"
  next-page-hover: "<gray>查看下一页搜索结果</gray>"
  collect: "<green>[收藏歌曲]</green>"
  collect-hover: "<gray>收藏到「我的喜欢」</gray>"
  all-loading: "<gray>正在并发搜索全部音源…</gray>"
  all-empty: "<red>全部音源都没有找到结果。</red>"
  all-header: "<gray>全部音源找到 </gray><white><count></white><gray> 条结果：</gray>"

queue:
  current: "<gray>正在播放：</gray><track>"
  entry: "<gray><index>.</gray> <track>"
  empty: "<gray>队列是空的。</gray>"

now-playing:
  nothing: "<gray>当前没有在播放。</gray>"
  line: "<gray>正在播放</gray> <track> <dark_gray>(<position>/<duration>)</dark_gray> <dark_gray>·</dark_gray> <white><volume>%</white> <gray>音量</gray> <dark_gray>·</dark_gray> <white><bass>%</white> <gray>低音增强</gray>"

skip:
  done: "<gray><player> 跳过了当前歌曲。</gray>"

pause:
  done: "<gray><player> 暂停了播放。</gray>"

resume:
  done: "<gray><player> 恢复了播放。</gray>"

stop:
  done: "<gray><player> 停止了播放并清空了队列。</gray>"

volume:
  usage: '<gray>用法：<white>/music volume \<0-100></white></gray>'
  invalid: "<red>音量必须是整数。</red>"
  range: "<red>音量必须在 0 到 100 之间。</red>"
  set: "<gray><player> 把音量设为 <white><volume>%</white>。</gray>"

bassboost:
  usage: '<gray>用法：<white>/music bassboost \<0-200></white></gray>'
  invalid: "<red>低音增强必须是一个数字。</red>"
  range: "<red>低音增强必须在 0 到 200 之间。</red>"
  set: "<gray><player> 把低音增强设为 <white><bass>%</white>。</gray>"

kill:
  warning: "<red><bold>注意！</bold>这会强制结束本组的播放器，音频包突然中断时组内玩家可能会听到一下杂音。</red><newline><newline><gray>确认无误请再执行一次。</gray>"
  broadcast: "<red><player> 强制结束了播放器。</red>"

track:
  now-playing: "<gray>正在播放：</gray><track>"
  failed: "<red>播放失败：<reason></red>"
  internal-error: "<red>播放失败，原因是内部错误。</red>"
  stuck: "<yellow>歌曲卡住了，已跳过。</yellow>"

playback:
  queue-empty: "<gray>没有更多歌曲可播放了。</gray>"

lang:
  current: "<gray>当前语言：<white><language></white></gray>"
  available: "<gray>可用语言：<white><languages></white></gray>"
  set: "<gray>已将语言设置为 <white><language></white>。</gray>"
  reset: "<gray>已恢复自动选择语言（当前为 <white><language></white>）。</gray>"
  unknown: "<red>未知的语言 <white><language></white>。</red> <gray>可用：</gray><white><languages></white>"

service:
  already: "<gray>语音聊天服务已经注册过了。</gray>"
  attempted: "<gray>已尝试注册，详细信息请查看控制台。</gray>"

# Simple Voice Chat 客户端设置里显示的音量分类（纯文本，不要写标签）
category:
  name: "音乐"
  description: "串流音乐的音量。"

# BOSS 栏：<title> 是文件名（取不到文件名时用歌曲标题），
# <position>/<duration> 形如 1:23/3:45。
bossbar:
  title: "<white><title></white> <dark_gray>[</dark_gray><gray><position></gray><dark_gray>/</dark_gray><gray><duration></gray><dark_gray>]</dark_gray>"
  unknown-duration: "--:--"

# 酷狗音乐

