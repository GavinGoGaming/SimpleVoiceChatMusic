  line: "<text>"

# 每个玩家自己的默认搜索/播放音源
source:
  bilibili: "B 站"
  netease: "网易云"
  youtube: "YouTube"
  soundcloud: "SoundCloud"
  all: "全部音源"
  current: "<gray>你当前的默认音源：</gray><white><source></white>"
  available: '<gray>可用：</gray><white>bilibili</white><gray> / </gray><white>netease</white><gray> / </gray><white>youtube</white><gray> / </gray><white>soundcloud</white> <dark_gray>（/music source \<id> 切换）</dark_gray>'
  set: "<green>默认音源已切换为 </green><white><source></white><gray>，之后 /music play、/music search 都用它。</gray>"
  reset: "<green>已恢复服务器默认音源：</green><white><source></white>"
  unknown: "<red>未知音源：</red><white><input></white><gray>。可选 bilibili / netease / youtube / soundcloud。</gray>"

